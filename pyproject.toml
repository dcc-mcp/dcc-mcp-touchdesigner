[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-touchdesigner"
version = "0.1.1"
description = "TouchDesigner integration for the DCC Model Context Protocol (MCP) ecosystem — embeds a Streamable HTTP MCP server directly inside TouchDesigner"
authors = [{ name = "Long Hao", email = "hal.long@outlook.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["touchdesigner", "mcp", "dcc", "ai", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
]

dependencies = ["dcc-mcp-core>=0.19.91,<1.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.8.0",
    "pyyaml>=5.0",
    "build>=1.2",
    "twine>=7.0; python_version >= '3.10'",
    "twine>=6.2,<7.0; python_version < '3.10'",
]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-touchdesigner"
Repository = "https://github.com/dcc-mcp/dcc-mcp-touchdesigner"
Issues = "https://github.com/dcc-mcp/dcc-mcp-touchdesigner/issues"

[project.entry-points."dcc_mcp.adapters"]
touchdesigner = "dcc_mcp_touchdesigner:TouchDesignerMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_touchdesigner"]
artifacts = ["src/dcc_mcp_touchdesigner/skills/**"]

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/**/*.png",
    "docs/**/*.svg",
    "docs/**/*.webp",
    "/.venv",
    "/build",
    "/dist",
    "/venv",
    "/work",
    "/work-*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not e2e and not packaging'"
markers = [
    "e2e: end-to-end tests that require a real TouchDesigner process",
    "packaging: tests for packaging that require network access to PyPI",
]

[tool.coverage.run]
source = ["dcc_mcp_touchdesigner"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dcc_mcp_touchdesigner"]
