name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build twine
      - name: Install dcc-mcp-cli
        env:
          DCC_MCP_CLI_VERSION: 0.20.2
          DCC_MCP_CLI_SHA256: 1168ebe901cfc0526d3d0f363d18ac4f8e21d2bcc874557e5813acbee8480f9c
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/dcc-mcp-cli \
            "https://github.com/dcc-mcp/dcc-mcp-core/releases/download/v${DCC_MCP_CLI_VERSION}/dcc-mcp-cli-linux-x86_64"
          echo "${DCC_MCP_CLI_SHA256}  /tmp/dcc-mcp-cli" | sha256sum --check
          chmod +x /tmp/dcc-mcp-cli
          sudo install /tmp/dcc-mcp-cli /usr/local/bin/dcc-mcp-cli
      - name: Lint
        run: |
          ruff check src tests packaging .github/scripts
          ruff format --check src tests packaging .github/scripts
      - name: Validate packaged Skill
        run: dcc-mcp-cli lint --warnings-as-errors src/dcc_mcp_touchdesigner/skills/touchdesigner-scripting
      - name: Test
        run: pytest
      - name: Build
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          twine check dist/*
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          wheel-smoke/bin/python -c "import importlib.resources as r; root = r.files('dcc_mcp_touchdesigner'); assert root.joinpath('skills', 'touchdesigner-scripting', 'tools.yaml').is_file()"
